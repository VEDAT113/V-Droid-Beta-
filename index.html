<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050609"><meta name="description" content="V-Droid Mobile — koyu cam mobil arayüzü"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>V-Droid Mobile</title>
<style>
:root{color-scheme:dark;--bg:#030406;--panel:#0d1016;--line:#252c38;--muted:#8b94a5;--txt:#f3f5fa;--accent:#cbd2df}*{box-sizing:border-box}body{margin:0;background:#030406;color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer;border:1px solid #303847;background:linear-gradient(145deg,#1c222d,#090b10);border-radius:14px;padding:10px}button:active{transform:scale(.97)}input,textarea{width:100%;background:#0b0e14;border:1px solid #2c3441;color:#fff;border-radius:13px;padding:12px;outline:none}.wall{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 75% 8%,#202733 0,transparent 34%),radial-gradient(ellipse at 13% 75%,#151c29 0,transparent 38%),linear-gradient(145deg,#020305,#10141c 53%,#020305)}.wall:after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 23%,#fff0 25%,#ffffff08 25.3%,transparent 27%,transparent 58%,#dce5f511 59%,transparent 61%);pointer-events:none}.status{height:29px;padding:7px 18px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:650;letter-spacing:.2px}.appframe{height:calc(100dvh - 29px);max-width:520px;margin:auto;padding:8px 17px 88px;overflow:auto;scrollbar-width:none}.top{display:flex;align-items:center;gap:9px}.mark{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;border:1px solid #505968;background:linear-gradient(145deg,#333b49,#07090d);font-size:22px;font-weight:250}.wordmark{letter-spacing:3px;font-weight:750}.muted{color:var(--muted);font-size:11px}.spacer{flex:1}.circlebtn{border-radius:50%;width:36px;height:36px;padding:0}.hero{margin:24px 0 12px}.hero h1{font-weight:300;font-size:38px;line-height:1.02;letter-spacing:-1.8px;margin:8px 0 14px}.hero h1 span{color:#aeb6c6}.widgets{display:grid;grid-template-columns:1.1fr .9fr;gap:9px;margin:18px 0 21px}.widget{background:linear-gradient(145deg,#151a23e8,#0b0d13e8);border:1px solid #323a48;border-radius:18px;padding:13px;min-height:86px;backdrop-filter:blur(18px)}.big{font-size:28px;font-weight:300}.search{display:flex;align-items:center;gap:8px;border-radius:22px;background:#151922e8;border:1px solid #313948;padding:10px 13px;color:#9ca5b5;margin:15px 0}.section{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.section h2{font-size:11px;letter-spacing:2px;margin:0}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px 5px}.app{display:flex;align-items:center;flex-direction:column;gap:6px;background:transparent;border:0;padding:0;min-width:0;font-size:10px}.ico{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#252d3b,#080a0e);border:1px solid #4a5364;box-shadow:inset 0 1px #ffffff18,0 6px 16px #0008;font-size:21px;color:#e5e9f1}.dock{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(90%,390px);display:flex;justify-content:space-around;align-items:center;padding:8px;border-radius:22px;background:#10141de8;border:1px solid #384151;backdrop-filter:blur(25px);z-index:3;box-shadow:0 12px 40px #0009}.dock button{border:0;background:transparent;font-size:20px;padding:7px 12px}.screen{position:fixed;inset:0;z-index:5;overflow:auto;background:#05070bf7;backdrop-filter:blur(28px);padding:calc(env(safe-area-inset-top) + 13px) 17px calc(env(safe-area-inset-bottom) + 24px)}.inner{max-width:520px;margin:auto}.head{display:flex;align-items:center;gap:11px;margin-bottom:19px}.head h2{font-size:22px;font-weight:500;margin:0;flex:1}.list{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #202632}.list .ico{flex-shrink:0}.info{flex:1;min-width:0}.info small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.list button{padding:7px 10px;font-size:11px}.tag{font-size:10px;border:1px solid #394151;color:#bdc5d3;padding:4px 8px;border-radius:20px}.bottomtabs{position:sticky;bottom:-24px;display:flex;justify-content:space-around;background:#090c12f0;padding:13px 2px;border-top:1px solid #252c38;margin-top:22px;color:#b9c1d0;font-size:10px}.bottomtabs button{background:transparent;border:0;padding:4px;font-size:10px}.note{height:47vh;resize:none}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{border-radius:17px;background:linear-gradient(145deg,#242b37,#10131a);border:1px solid #343c49;text-align:center;padding:16px 4px;font-size:11px}.tile b{display:block;font-size:23px;margin-bottom:7px}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calcgrid button{border-radius:50px;padding:15px 2px;font-size:18px}.storegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.storecard{background:linear-gradient(145deg,#161b25,#080a0f);border:1px solid #2b3340;border-radius:17px;padding:12px}.storecard p{font-size:11px;color:var(--muted);height:28px}.storecard .ico{margin-bottom:10px}.storecard button{width:100%;font-size:11px;padding:8px}.art{height:220px;border-radius:20px;border:1px solid #323a48;background:radial-gradient(circle at 50% 30%,#414b5d,#161b25 50%,#07090d);display:grid;place-items:center;text-align:center;margin:16px 0}.art .mark{width:70px;height:70px;font-size:44px;margin:auto}.lock{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 40%,#242b37,#080a0f 60%,#020305);display:flex;flex-direction:column;align-items:center;padding:8px 20px 25px;text-align:center}.locktime{font-size:72px;font-weight:200;letter-spacing:-4px;margin-top:10vh}.lockdate{font-size:14px}.lockmark{margin-top:auto;font-size:68px;font-weight:200;letter-spacing:-10px;transform:skew(-12deg);text-shadow:0 0 30px #cdd6e555}.lockbrand{letter-spacing:6px;margin-top:0}.lockhint{margin-top:auto;color:#aeb5c3;font-size:11px}.handle{height:4px;width:105px;background:#f4f5f8;border-radius:8px;margin-top:15px}.toast{display:none;position:fixed;z-index:20;bottom:90px;left:50%;transform:translateX(-50%);background:#e9edf5;color:#080a0e;padding:10px 14px;border-radius:12px;font-size:12px}.quick{position:fixed;inset:0;z-index:8;background:#07090df7;padding:40px 18px;overflow:auto}.quickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brightness{width:100%;margin:20px 0}.gallerygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gallerygrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}
</style></head><body><div class="wall"></div><div class="status"><span>V-Droid</span><span id="statusTime">22:47　▮▮▮ ◉ 87%</span></div>
<main class="appframe" id="home"><header class="top"><div class="mark">V</div><div><div class="wordmark">V-DROID</div><div class="muted">MOBILE SYSTEM</div></div><div class="spacer"></div><button class="circlebtn" onclick="quickSettings()">☷</button><button class="circlebtn" onclick="openApp('settings')">⚙</button></header>
<section class="widgets"><div class="widget"><div class="muted">İstanbul</div><div class="big">15° ☁</div><div class="muted">Çok bulutlu · Örnek veri</div></div><div class="widget"><div class="muted" id="date">24 Ekim</div><div class="big" id="homeTime">22:47</div><div class="muted" id="weekday">Cuma</div></div></section>
<div class="search" onclick="openApp('search')">⌕ &nbsp; Uygulama ara... <span class="spacer"></span> ◉</div>
<div class="section"><h2>UYGULAMALAR</h2><button style="font-size:10px;padding:6px 9px" onclick="openApp('allapps')">Tümü ↗</button></div><section class="apps" id="apps"></section>
<div class="section"><h2>ÖNE ÇIKANLAR</h2><span class="tag">V-DROID STORE</span></div><div class="list"><span class="ico">▽</span><div class="info">V-Droid Store<small>Uygulamalar ve daha fazlası</small></div><button onclick="openApp('store')">Keşfet</button></div>
</main><nav class="dock"><button onclick="showHome()">⌂</button><button onclick="openApp('browser')">◎</button><button onclick="openApp('store')">▽</button><button onclick="openApp('camera')">▣</button></nav><div id="layer"></div><div id="toast" class="toast"></div>
<script>
const apps=[['store','V-Droid Store','▽','Uygulama kataloğu'],['browser','Tarayıcı','◉','Web adresleri'],['files','Dosyalar','▰','Dosya seçici'],['camera','Kamera','▣','Kamera erişimi'],['gallery','Galeri','▧','Fotoğraf galerisi'],['music','Müzik','♫','Müzik çalar'],['settings','Ayarlar','⚙','Sistem ayarları'],['notes','Notlar','▤','Notlarını kaydet'],['calc','Hesap Makinesi','⌗','Hesaplama'],['clock','Saat','◷','Dijital saat'],['calendar','Takvim','▦','Etkinlikler'],['email','E-posta','✉','E-posta bağlantıları'],['weather','Hava durumu','☁','Hava durumu görünümü'],['account','V-Droid Hesabı','♙','Yerel kullanıcı profili'],['downloads','İndirilenler','↓','Dosyalar'],['games','Oyunlar','♧','Mini oyun']];
const catalog=[['YouTube','Video','▶','https://youtube.com'],['Gmail','E-posta','M','https://mail.google.com'],['Google Maps','Haritalar','⌖','https://maps.google.com'],['Chrome','Tarayıcı','◉','https://google.com/chrome'],['Google Drive','Depolama','△','https://drive.google.com'],['ChatGPT','Yapay zekâ','✦','https://chatgpt.com'],['Instagram','Sosyal medya','◎','https://instagram.com'],['WhatsApp','Mesajlaşma','◉','https://whatsapp.com'],['Discord','Topluluk','◈','https://discord.com'],['Spotify','Müzik','♫','https://spotify.com'],['TikTok','Video','♪','https://tiktok.com'],['Telegram','Mesajlaşma','➤','https://telegram.org']];
document.getElementById('apps').innerHTML=apps.slice(0,12).map(a=>`<button class="app" onclick="openApp('${a[0]}')"><span class="ico">${a[2]}</span><span>${a[1]}</span></button>`).join('');
function now(){let d=new Date(),t=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});document.getElementById('statusTime').textContent=t+'　▮▮▮ ◉ 87%';document.getElementById('homeTime').textContent=t;document.getElementById('date').textContent=d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});document.getElementById('weekday').textContent=d.toLocaleDateString('tr-TR',{weekday:'long'});let b=document.getElementById('locktime');if(b)b.textContent=t}now();setInterval(now,15000);
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function showHome(){document.getElementById('layer').innerHTML='';document.getElementById('home').style.display='block'}
function shell(title,body){document.getElementById('home').style.display='none';document.getElementById('layer').innerHTML=`<section class="screen"><div class="inner"><header class="head"><button onclick="showHome()">‹</button><h2>${title}</h2><span class="tag">V-Droid</span></header>${body}<div class="bottomtabs"><button onclick="showHome()">⌂<br>Ana sayfa</button><button onclick="openApp('files')">▤<br>Dosyalar</button><button onclick="openApp('store')">▽<br>Keşfet</button><button onclick="openApp('settings')">⚙<br>Ayarlar</button></div></div></section>`}
function openApp(a){let title=(apps.find(x=>x[0]===a)||[])[1]||({allapps:'Uygulamalar',search:'Ara'})[a]||a;
if(a==='allapps'||a==='search')shell(a==='search'?'Ara':'Uygulamalar',`<input placeholder="Uygulamalarda ara..." oninput="filterApps(this.value)" style="margin-bottom:15px"><div id="alllist">${apps.map(x=>`<div class="list appentry" data-t="${(x[1]+' '+x[3]).toLowerCase()}"><span class="ico">${x[2]}</span><div class="info">${x[1]}<small>${x[3]}</small></div><button onclick="openApp('${x[0]}')">Aç</button></div>`).join('')}</div>`)
else if(a==='store')shell(title,`<input placeholder="Uygulama ve oyun ara..." oninput="filterStore(this.value)" style="margin-bottom:14px"><div class="section"><h2>SİZE ÖZEL</h2><span class="tag">ÖNE ÇIKAN</span></div><div class="art"><div><div class="mark" style="margin:auto;width:65px;height:65px">V</div><h2>V-Droid Öneriyor</h2><div class="muted">Uygulamaları keşfet</div></div></div><div class="storegrid" id="storegrid">${catalog.map(c=>storeCard(c)).join('')}</div><p class="muted">Mağaza şu an web uygulaması kısayollarını listeler; uygulama yükleme, ödeme ve indirme altyapısı içermez.</p>`)
else if(a==='notes'){shell(title,`<p class="muted">Notlar bu tarayıcıda yerel olarak kaydedilir.</p><textarea id="note" class="note" placeholder="Notlarını yaz..."></textarea><p><button onclick="saveNote()">Kaydet ✓</button> <span id="saved" class="muted"></span></p>`);document.getElementById('note').value=localStorage.getItem('vd-notes')||''}
else if(a==='settings')shell(title,`<div class="list"><span class="ico">♙</span><div class="info">V-Droid Hesabı<small>Yerel profil</small></div><button onclick="openApp('account')">Aç</button></div>${[['Wi-Fi','Kablosuz ağ durumu'],['Bluetooth','Bağlı cihazlar'],['Bildirimler','Bildirim tercihleri'],['Pil','87% · Tahmini gösterim'],['Depolama','Yerel dosyalar'],['Güvenlik ve Gizlilik','Ekran kilidi ve izinler'],['Sistem','Dil, tarih ve saat']].map((x,i)=>`<div class="list"><span class="ico">${['◉','ᛒ','♧','▣','▤','⬡','⚙'][i]}</span><div class="info">${x[0]}<small>${x[1]}</small></div><button onclick="toast('Bu demo arayüzünde sistem ayarı değiştirilemez')">›</button></div>`).join('')}<p><button onclick="installApp()">Ana ekrana yükle</button></p>`)
else if(a==='files'||a==='gallery'||a==='downloads')shell(title,`<input type="file" ${a==='gallery'?'accept="image/*"':''} multiple onchange="listFiles(this.files)" style="margin:12px 0"><div id="picked"></div><p class="muted">Tarayıcı güvenliği nedeniyle cihazın tamamı otomatik taranamaz; seçtiğin dosyalar burada görünür.</p>`)
else if(a==='browser')shell(title,`<div class="search">https://www.google.com</div><input id="url" placeholder="Arama yap veya URL gir"><button style="margin-top:10px" onclick="goUrl()">Git ↗</button><div class="section"><h2>HIZLI ERİŞİM</h2></div>${catalog.slice(0,4).map(c=>`<div class="list"><span class="ico">${c[2]}</span><div class="info">${c[0]}<small>${c[1]}</small></div><button onclick="window.open('${c[3]}','_blank','noopener')">Aç</button></div>`).join('')}`)
else if(a==='calc')shell(title,`<input id="display" value="0" readonly style="font-size:34px;text-align:right;margin-bottom:10px"><div class="calcgrid">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button onclick="calcKey('${k}')">${k}</button>`).join('')}</div>`)
else if(a==='music')shell(title,`<div class="art"><div><div class="mark" style="width:75px;height:75px;font-size:42px;margin:auto">V</div><h2>V-Droid Theme</h2><div class="muted">Daha fazlası seninle...</div></div></div><input type="file" accept="audio/*" onchange="playAudio(this.files[0])"><audio id="audio" controls style="width:100%;margin-top:18px"></audio>`)
else if(a==='clock')shell(title,`<div class="art"><div><div id="bigclock" style="font-size:55px;font-weight:250"></div><div class="muted">Cihaz saati</div></div></div>`)
else if(a==='calendar')shell(title,`<h3>Etkinlikler</h3><input id="event" placeholder="Etkinlik ekle"><button style="margin-top:10px" onclick="addEvent()">Kaydet</button><div id="events"></div>`),renderEvents()
else if(a==='account'){let p=JSON.parse(localStorage.getItem('vd-profile')||'{"name":"V-Droid Kullanıcısı","email":""}');shell(title,`<div class="art"><div><div class="mark" style="width:65px;height:65px;margin:auto">V</div><h2>V-Droid Hesabı</h2><div class="muted">Yerel kullanıcı profili</div></div></div><label class="muted">Görünen ad</label><input id="pname" value="${esc(p.name)}" style="margin:6px 0 14px"><label class="muted">E-posta etiketi</label><input id="pemail" value="${esc(p.email)}" placeholder="ornek@eposta.com" style="margin:6px 0 14px"><button onclick="saveProfile()">Profili kaydet</button><p class="muted">Gerçek hesap doğrulaması ve bulut eşitleme için sunucu gerekir.</p>`)}
else if(a==='camera')shell(title,`<video id="video" autoplay playsinline style="width:100%;border-radius:16px;background:#111;min-height:200px"></video><button style="margin-top:12px" onclick="startCamera()">Kamerayı aç</button><p class="muted">Kamera için HTTPS ve izin gerekebilir.</p>`)
else if(a==='weather')shell(title,`<div class="art"><div><div style="font-size:58px">☁</div><div style="font-size:44px">15°</div><h2>İstanbul</h2><div class="muted">Çok bulutlu · örnek veri, canlı hava durumu değil</div></div></div>`)
else if(a==='email')shell(title,`<div class="list"><span class="ico">M</span><div class="info">Gmail<small>E-posta hizmeti</small></div><button onclick="window.open('https://mail.google.com','_blank','noopener')">Aç</button></div><div class="list"><span class="ico">O</span><div class="info">Outlook<small>E-posta hizmeti</small></div><button onclick="window.open('https://outlook.live.com','_blank','noopener')">Aç</button></div>`)
else if(a==='games')shell(title,`<p>1 ile 5 arasında bir sayı seç.</p><div class="tiles">${[1,2,3,4,5].map(n=>`<button onclick="toast(${n===3?`'Bildin!'`:`'Tekrar dene!'`})">${n}</button>`).join('')}</div>`)
}
function storeCard(c){return `<article class="storecard" data-c="${(c[0]+' '+c[1]).toLowerCase()}"><span class="ico">${c[2]}</span><strong>${c[0]}</strong><p>${c[1]}</p><button onclick="window.open('${c[3]}','_blank','noopener')">Aç ↗</button></article>`}
function filterStore(q){document.querySelectorAll('[data-c]').forEach(e=>e.style.display=e.dataset.c.includes(q.toLowerCase())?'block':'none')}
function filterApps(q){document.querySelectorAll('.appentry').forEach(e=>e.style.display=e.dataset.t.includes(q.toLowerCase())?'flex':'none')}
function saveNote(){localStorage.setItem('vd-notes',document.getElementById('note').value);document.getElementById('saved').textContent='Kaydedildi ✓'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveProfile(){localStorage.setItem('vd-profile',JSON.stringify({name:document.getElementById('pname').value,email:document.getElementById('pemail').value}));toast('Profil kaydedildi')}
function listFiles(fs){document.getElementById('picked').innerHTML=[...fs].map(f=>`<div class="list"><span class="ico">▤</span><div class="info">${esc(f.name)}<small>${Math.ceil(f.size/1024)} KB</small></div></div>`).join('')}
function goUrl(){let u=document.getElementById('url').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank','noopener')}
function playAudio(f){if(f)document.getElementById('audio').src=URL.createObjectURL(f)}
let exp='';function calcKey(k){let d=document.getElementById('display');if(k==='AC'){exp='';d.value='0';return}if(k==='⌫'){exp=exp.slice(0,-1);d.value=exp||'0';return}if(k==='='){try{let s=exp.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+*/(). -]+$/.test(s))throw 0;d.value=Function('"use strict";return ('+s+')')();exp=d.value}catch{d.value='Hata';exp=''}return}if(k==='±'){exp=String(-Number(exp||0));d.value=exp;return}exp+=k;d.value=exp}
function addEvent(){let e=document.getElementById('event');if(!e.value)return;let ar=JSON.parse(localStorage.getItem('vd-events')||'[]');ar.push(e.value);localStorage.setItem('vd-events',JSON.stringify(ar));renderEvents();e.value=''}
function renderEvents(){let el=document.getElementById('events');if(el)el.innerHTML=JSON.parse(localStorage.getItem('vd-events')||'[]').map(e=>`<div class="list">${esc(e)}</div>`).join('')}
async function startCamera(){try{document.getElementById('video').srcObject=await navigator.mediaDevices.getUserMedia({video:true})}catch(e){toast('Kamera için HTTPS ve izin gerekir')}}
function quickSettings(){document.getElementById('layer').innerHTML=`<section class="quick"><div class="quickhead"><h2>22:47 · 24 Ekim</h2><button onclick="showHome()">✕</button></div><div class="tiles">${[['◉','Wi-Fi'],['ᛒ','Bluetooth'],['▮','Mobil veri'],['☾','Rahatsız etme'],['↻','Otomatik döndür'],['✈','Uçak modu']].map(x=>`<button class="tile" onclick="this.style.borderColor='#aeb8ca';toast('${x[1]} demo kontrolü')"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div><p class="muted" style="margin-top:24px">Parlaklık</p><input class="brightness" type="range" min="20" max="100" value="75" oninput="document.querySelector('.wall').style.filter='brightness('+this.value+'%)'"><button onclick="openApp('settings')">Tüm ayarlar ⚙</button></section>`}
function installApp(){if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt=null}else toast('HTTPS üzerinden açıp tarayıcı menüsünden Ana ekrana ekle seç')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredPrompt=e});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
